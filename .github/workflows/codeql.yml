name: CodeQL

on:
  push:
    branches: [master, ci-test]
  pull_request:
    branches: [master]
  workflow_call:
    inputs:
      image_repo:
        description: 'Container image repository to use instead of the default'
        type: string
      image_suffix:
        description: 'Suffix appended to the image tag, e.g. to test new images'
        type: string

env:
  KDIR: 'any'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: 'ubuntu-26.04'
            meson_setup: '-D b_sanitize=none -D build-tests=false'

    container:
      image: ${{ inputs.image_repo || 'ghcr.io/kmod-project/kmod-ci' }}:${{ matrix.os }}${{ inputs.image_suffix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Mark workspace as safe for git
        # The container runs as root, but the workspace is owned by the
        # runner user: git refuses to operate on it after actions/checkout
        # (e.g. meson dist, setup-os only-if-changed).
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup OS if changed
        uses: ./.github/actions/setup-os
        with:
          only-if-changed: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: cpp
          queries: +security-and-quality

      - name: Build
        run: |
          meson setup --native-file build-dev.ini ${{ matrix.meson_setup }} builddir/
          meson compile -C builddir/

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:cpp"
          upload: false
          output: sarif-results

      - name: Filter out meson-internal test files
        uses: advanced-security/filter-sarif@2da736ff05ef065cb2894ac6892e47b5eac2c3c0 # v1.1
        with:
          patterns: |
            -builddir/meson-private/**/testfile.c
          input: sarif-results/cpp.sarif
          output: sarif-results/cpp.sarif

      - name: Upload CodeQL results to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: sarif-results/cpp.sarif
          category: "/language:cpp"
