name: Code Coverage

on:
  push:
    branches: [master, ci-test]
  pull_request:
    branches: [master]
  workflow_call:
    inputs:
      image_repo:
        description: 'Container image repository to use instead of the default'
        type: string
      image_suffix:
        description: 'Suffix appended to the image tag, e.g. to test new images'
        type: string

permissions:
  contents: read

env:
  KDIR: 'any'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: 'ubuntu-26.04'
            meson_setup: '-D b_sanitize=none -D b_coverage=true -Dmbedtls=disabled'

    container:
      image: ${{ inputs.image_repo || 'ghcr.io/kmod-project/kmod-ci' }}:${{ matrix.os }}${{ inputs.image_suffix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Mark workspace as safe for git
        # The container runs as root, but the workspace is owned by the
        # runner user: git refuses to operate on it after actions/checkout
        # (e.g. meson dist, setup-os only-if-changed).
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup OS if changed
        uses: ./.github/actions/setup-os
        with:
          only-if-changed: true

      - name: Build
        run: |
          meson setup --native-file build-dev.ini ${{ matrix.meson_setup }} builddir/
          meson compile -C builddir/
          meson test -C builddir/
          ninja -C builddir/ coverage-xml

      - name: Upload Coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: builddir/meson-logs/coverage.xml
          plugins: gcov
