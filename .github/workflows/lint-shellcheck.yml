name: ShellCheck

on:
  workflow_call:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup shellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Shellcheck
        run: |
          shellcheck --version
          shellcheck \
            .github/functions.sh \
            .github/actions/setup-os/*.sh \
            scripts/*.sh \
            shell-completion/bash/*
