name: Signed-off-by

on:
  workflow_call:
    inputs:
      base:
        description: Base commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  signed-off-by:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check Signed-off-by
        run: scripts/check-signed-off-by.sh "${{ inputs.base }}"
