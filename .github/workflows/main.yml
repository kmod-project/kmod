name: Build and Test

on:
  push:
    branches: [master, ci-test]
  pull_request:
    branches: [master]
  workflow_call:
    inputs:
      image_repo:
        description: 'Container image repository to use instead of the default'
        type: string
      image_suffix:
        description: 'Suffix appended to the image tag, e.g. to test new images'
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  KDIR: 'any'

jobs:
  prep:
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.vars.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/ci-matrix.json
          sparse-checkout-cone-mode: false

      - name: Set variables
        id: vars
        run: |
          # One job per build variant, with the tag of the prebuilt CI image
          echo "matrix=$(jq -c '[.[] as $img | $img["build-variants"][] | {os: $img.tag} + .]' .github/ci-matrix.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: prep
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prep.outputs.matrix) }}

    container:
      image: ${{ inputs.image_repo || 'ghcr.io/kmod-project/kmod-ci' }}:${{ matrix.os }}${{ inputs.image_suffix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Mark workspace as safe for git
        # The container runs as root, but the workspace is owned by the
        # runner user: git refuses to operate on it after actions/checkout
        # (e.g. meson dist, setup-os only-if-changed).
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup OS if changed
        uses: ./.github/actions/setup-os
        with:
          only-if-changed: true

      - name: configure
        run: |
          do_setup() {
            setup_options="${{ matrix.meson_setup }}"

            if [[ "$2" == "32" ]]; then
              echo "::notice::TODO fix and reuse the original options."
              setup_options="$setup_options -Dzstd=disabled -Dxz=disabled -Dzlib=disabled -Dopenssl=disabled -Dmbedtls=disabled"

              echo "::notice::TODO fix and re-enable sanitizer(s)."
              setup_options="$setup_options -Db_sanitize=none"
            fi

            [[ -n "${{ matrix.linker }}" ]] && export CC_LD="${{ matrix.linker }}"
            meson setup --native-file build-dev.ini $setup_options "$1"
          }

          source .github/functions.sh
          for_each_config "${{ matrix.only_compiler }}" "${{ matrix.only_bits }}" "${{ matrix.custom }}" do_setup

      - name: build
        run: |
          do_build() {
            meson compile -C "$1"
          }
          source .github/functions.sh
          for_each_config "${{ matrix.only_compiler }}" "${{ matrix.only_bits }}" "${{ matrix.custom }}" do_build

      - name: test
        run: |
          do_test() {
            unset MAKEFLAGS

            if [[ -n "${{ matrix.skip_test }}" && "${{ matrix.skip_test }}" == "$2" ]]; then
              echo "::notice::Skipping tests"
              return 0
            fi
            if [[ -n "${{ matrix.modules_makeflags }}" ]]; then
              export MAKEFLAGS="${{ matrix.modules_makeflags }}"
            fi
            meson test -C "$1" || meson test -C "$1" --verbose
          }
          source .github/functions.sh
          for_each_config "${{ matrix.only_compiler }}" "${{ matrix.only_bits }}" "${{ matrix.custom }}" do_test

      - name: install
        run: |
          do_install() {
            DESTDIR=$PWD/inst meson install -C "$1"
          }
          source .github/functions.sh
          for_each_config "${{ matrix.only_compiler }}" "${{ matrix.only_bits }}" "${{ matrix.custom }}" do_install

      - name: distcheck
        run: |
          do_distcheck() {
            if [[ "$2" == "32" ]]; then
              echo "::notice::Skipping 32bit distcheck"
              return 0
            fi
            meson dist -C "$1"
          }
          source .github/functions.sh
          for_each_config "${{ matrix.only_compiler }}" "${{ matrix.only_bits }}" "${{ matrix.custom }}" do_distcheck
