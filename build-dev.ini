[project options]
build-tests = true
debug-messages = true
docs = true
zstd = 'enabled'
xz = 'enabled'
zlib = 'enabled'
openssl = 'enabled'
mbedtls = 'enabled'
werror = true
b_sanitize = 'address,undefined'

[built-in options]
buildtype = 'debugoptimized'
